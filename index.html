<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Game Galaxy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      <span class="logo-text">Unblocked Game Galaxy</span>
    </a>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="#" class="coming-soon">About</a></li>
      <li><a href="#" class="coming-soon">Update Log</a></li>
      <li><a href="settings.html">Settings</a></li>
    </ul>

    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to Unblocked Game Galaxy</h1>
    </div>
  </section>

  <main class="container">
    <div class="games-header">
      <h2>All Games</h2>
      <span class="game-count">1 game</span>
    </div>

    <!-- Static game cards (no JS list) -->
    <div class="games-grid">
      <a href="run3.html" class="game-card game-card-link">
        <div class="game-thumb">🏃</div>
        <div class="game-info">
          <div class="game-title">Run 3</div>
          <div class="game-tag">Arcade</div>
        </div>
      </a>
    </div>
  </main>

  <footer class="footer">
    <p>Unblocked Game Galaxy &copy; 2026 • For fun & educational use</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
